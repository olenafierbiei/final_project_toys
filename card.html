<!doctype html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Delius+Unicase:wght@400;700&family=Farro:wght@300;400;500;700&family=Francois+One&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:wght@800&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playwrite+NZ+Basic+Guides&family=Quicksand:wght@300..700&family=Raleway:ital,wght@0,100..900;1,100..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Sans+3:ital,wght@1,600&family=Work+Sans:ital,wght@1,100..900&display=swap"
    rel="stylesheet" />
  <link rel="icon" type="image/png" href="img/logo1.png" sizes="32x32" />
  <title>KnitWonders | В'язані іграшки та пледи</title>
  <link rel="stylesheet" href="style_hero.css" />
  <link rel="stylesheet" href="style_header.css" />
  <link rel="stylesheet" href="style_products.css" />
  <link rel="stylesheet" href="style_reviews.css" />
  <link rel="stylesheet" href="style_footer.css" />
  <link rel="stylesheet" href="style_card.css">
  <script src="script.js" defer></script>
  <script src="script_reviews.js" defer></script>
  <script src="include.js" defer></script>
  <script src="script_catalog.js" defer></script>
  <script src="script_card.js" defer></script>
</head>

<body>
  <div id="header-placeholder"></div>
  <section class="cart-page">
    <div class="container">
      <h1>Ваше замовлення</h1>
      <div id="cart-items-container">
        <p>Кошик порожній...</p>
      </div>

      <div class="cart-summary">
        <h3>Разом: <span id="cart-total-price">0</span> грн</h3>
        <button id="order-confirm-btn" class="submit-btn">
          Оформити замовлення
        </button>
        <a href="index.html" class="continue-shopping">Повернутися до покупок</a>
      </div>
    </div>
    <dialog id="order-modal" class="modal">
      <div class="modal-content">
        <button class="close-modal" id="close-order-modal">&times;</button>

        <div id="step-1">
          <h2>Підтвердження замовлення</h2>
          <div id="order-items-preview" class="order-preview">
          </div>
          <div class="modal-total">
            Разом до оплати: <span id="modal-total-sum">0</span> грн
          </div>
          <button id="next-to-form" class="submit-btn">Перейти до оформлення</button>
        </div>

        <form id="order-data-form" hidden>
          <h2>Дані отримувача</h2>
          <div class="form-row">
            <input type="text" placeholder="Прізвище" required name="lastname">
          </div>
          <div class="form-row">
            <input type="text" placeholder="Ім'я" required name="firstname">
          </div>
          <div class="form-row">
            <input type="text" placeholder="По батькові" required name="middlename">
          </div>
          <div class="form-row">
            <input type="text" placeholder="Адреса доставки (місто, відділення)" required name="address">
          </div>

          <div class="form-row">
            <label>Спосіб оплати:</label>
            <select name="payment" required>
              <option value="card">Картка</option>
              <option value="cash">Оплата при отриманні</option>
              <option value="cod">Наложений платіж</option>
            </select>
          </div>

          <button type="submit" class="submit-btn">Замовити</button>
          <button type="button" id="back-to-step1" class="back-link">Повернутися до списку</button>
        </form>
      </div>
    </dialog>
  </section>
  <div id="footer-placeholder"></div>
</body>

</html>
